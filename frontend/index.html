<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/wisdomSvg.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#E8E2D6" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <title>frontend</title>


        <style>
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        background: #e8e2d6;
        transition: opacity 0.5s ease, visibility 0.5s ease;
      }
      #app-splash.is-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #app-splash img {
        width: min(280px, 60vw);
        height: auto;
        animation: splash-in 0.8s ease-out both;
      }
      #app-splash .splash-bar {
        position: relative;
        width: min(180px, 45vw);
        height: 2px;
        overflow: hidden;
        background: rgba(140, 106, 67, 0.25);
      }
      #app-splash .splash-bar::after {
        content: "";
        position: absolute;
        inset: 0;
        width: 40%;
        background: #8c6a43;
        animation: splash-bar 1.2s ease-in-out infinite;
      }
      @keyframes splash-in {
        from { opacity: 0; transform: translateY(12px) scale(0.97); }
        to   { opacity: 1; transform: none; }
      }
      @keyframes splash-bar {
        from { transform: translateX(-100%); }
        to   { transform: translateX(250%); }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-splash img,
        #app-splash .splash-bar::after { animation: none; }
        #app-splash .splash-bar::after { width: 100%; }
      }
    </style>
  </head>
  <body>

     <div id="app-splash" role="status" aria-label="Loading Ancient Wisdom">
      <img src="/ancient-wisdom-logo.svg" alt="Ancient Wisdom" />
      <div class="splash-bar"></div>
    </div>

    
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
